<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' app:" />
    <title>Photosphere</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="titlebar"></div>

    <div id="drop" class="drop" hidden><span>Drop to add</span></div>
    <div id="zoom-badge" class="badge-pill surface" hidden></div>
    <div id="notice" class="notice surface" hidden></div>
    <div id="hint" class="hint" hidden></div>

    <div id="center" class="center">
      <div id="panel" class="panel surface">
        <div id="pane-holder" class="pane-holder"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
